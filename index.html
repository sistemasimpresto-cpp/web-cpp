<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mi Página en GitHub</title>
    <style>
        /* Estilos rápidos para que se vea ordenado */
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        .campo { margin-bottom: 15px; }
        .campo label { display: block; margin-bottom: 5px; font-weight: bold; }
        .campo input, .campo textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; cursor: pointer; width: 100%; }
        button:disabled { background-color: #a5d6a7; cursor: not-allowed; }
        .alerta { display: none; padding: 10px; margin-top: 15px; border-radius: 4px; text-align: center; }
        .exito { display: block; background-color: #d4edda; color: #155724; }
    </style>
</head>
<body>

    <h2>Formulario de Contacto</h2>

    <!-- EL FORMULARIO HTML -->
    <!-- Reemplaza la URL de abajo por el enlace "Web App" que te dio Google Apps Script -->
    <form id="formularioGoogle" action="https://script.google.com/macros/s/AKfycby61R19tByKcYtbXR9P8i2zcy5f6cdJWOABvQcTkW4QlRTO98lby9TgKy_hrt44NsNtWg/exec" method="POST">
        
        <div class="campo">
            <label for="nombre">Nombre Completo:</label>
            <!-- El 'name' debe ser EXACTO al encabezado de tu columna en Google Sheets -->
            <input type="text" id="nombre" name="Nombre" required>
        </div>

        <div class="campo">
            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" name="Correo" required>
        </div>

        <div class="campo">
            <label for="mensaje">Mensaje o Comentarios:</label>
            <textarea id="mensaje" name="Mensaje" rows="4" required></textarea>
        </div>

        <button type="submit" id="btnEnviar">Enviar Formulario</button>
    </form>

    <!-- MENSAJE DE ÉXITO -->
    <div id="mensajeConfirmacion" class="alerta"></div>


    <!-- EL SCRIPT DE JAVASCRIPT -->
    <script>
        // 1. Detectamos los elementos del HTML por su ID
        const form = document.getElementById('formularioGoogle');
        const botonSubmit = document.getElementById('btnEnviar');
        const mensajeAviso = document.getElementById('mensajeConfirmacion');

        // 2. Escuchamos el momento en el que el usuario hace clic en "Enviar"
        form.addEventListener('submit', function(evento) {
            
            // Evitamos que la página se recargue automáticamente
            evento.preventDefault(); 
            
            // Deshabilitamos el botón para evitar que le den doble clic por error
            botonSubmit.disabled = true;
            botonSubmit.innerText = "Guardando en Google Sheets...";

            // Capturamos todos los inputs y textareas del formulario automáticamente
            const datosFormulario = new FormData(form);

            // 3. Enviamos los datos usando la Fetch API (en segundo plano)
            fetch(form.action, {
                method: 'POST',
                body: datosFormulario,
                mode: 'no-cors' // Crucial para saltarse las restricciones de seguridad de Google
            })
            .then(() => {
                // Si la conexión fue exitosa, mostramos el aviso verde
                mensajeAviso.innerText = "¡Formulario enviado con éxito a la hoja de cálculo!";
                mensajeAviso.className = "alerta exito"; 
                
                // Limpiamos los campos del formulario
                form.reset(); 
            })
            .catch(error => {
                // Si ocurre un error de conexión a internet o la URL está caída
                console.error('Hubo un error:', error);
                alert('No se pudo enviar el formulario. Inténtalo más tarde.');
            })
            .finally(() => {
                // Volvemos a activar el botón pase lo que pase
                botonSubmit.disabled = false;
                botonSubmit.innerText = "Enviar Formulario";
            });
        });
    </script>

</body>
</html>
